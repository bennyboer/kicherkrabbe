<app-filter-layout
	[filtersTemplate]="filtersRef"
	[sortOptions]="sortOptions"
	[selectedSort]="selectedSort"
	[hasActiveFilters]="(hasActiveFilters$ | async) ?? false"
	(sortChange)="onSortChange($event)"
	(resetFilters)="resetFilters()"
>
	<ng-template #filtersRef>
		<div class="filter-group">
			<label>Suche</label>
			<input
				pInputText
				type="text"
				[ngModel]="searchTerm$ | async"
				(ngModelChange)="searchTerm$.next($event)"
				placeholder="Suchen..."
				class="w-full"
			/>
		</div>

		<div class="filter-group">
			<label>Kategorie</label>
			<p-multiselect
				[options]="(categories$ | async) ?? []"
				[ngModel]="selectedCategoryIds$ | async"
				(ngModelChange)="onCategoriesChange($event)"
				optionLabel="name"
				optionValue="id"
				placeholder="Kategorie wählen"
				[showClear]="true"
				[filter]="true"
				filterPlaceholder="Suchen..."
				selectedItemsLabel="{0} ausgewählt"
				styleClass="w-full"
			/>
		</div>
	</ng-template>

	<ng-container results>
		<h1>Stickereien</h1>

		@if (loading$ | async) {
			<div class="loading-container">
				<p-progressspinner strokeWidth="4" />
			</div>
		} @else {
			@if ((embroideries$ | async)?.length === 0) {
				<div class="empty-state">
					<p>Keine Stickereien gefunden.</p>
				</div>
			} @else {
				<div class="product-grid">
					@for (embroidery of embroideries$ | async; track embroidery.id) {
						<a [routerLink]="['/embroideries', embroidery.alias]" class="product-link">
							<app-embroidery-card [embroidery]="embroidery" />
						</a>
					}
				</div>

				@if (hasMore$ | async) {
					<div class="load-more-container">
						<p-button
							label="Mehr laden"
							[outlined]="true"
							(click)="loadMore()"
						/>
					</div>
				}
			}
		}
	</ng-container>
</app-filter-layout>
