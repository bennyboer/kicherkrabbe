<p-card styleClass="product-card">
	<ng-template #header>
		<div class="embroidery-image-container">
			<img
				[ngSrc]="embroidery.image"
				[alt]="embroidery.name + ' - Stickerei'"
				class="embroidery-image"
				fill
				sizes="(max-width: 576px) 50vw, (max-width: 992px) 33vw, 25vw"
			/>
		</div>
	</ng-template>
	<ng-template #title>
		{{ embroidery.name }}
	</ng-template>
</p-card>
